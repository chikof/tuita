# The Rust and Chromium browser suite (crates/tuita-e2e, scripts/e2e.sh), too slow for every push
# so it runs on a schedule instead, plus workflow_dispatch so a human can try it without waiting.
# See docs/architecture.md ("CI").
name: e2e-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Start services (Postgres)
        run: devenv up -d

      - name: e2e
        run: devenv shell -- scripts/e2e.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: target/e2e-server.log
          if-no-files-found: ignore
