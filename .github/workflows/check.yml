# The one gate (scripts/check.sh), run the same way a developer runs `check` locally, on every
# push to main and every pull request. See docs/architecture.md ("CI").
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Start services (Postgres)
        run: devenv up -d

      - name: check
        run: devenv shell -- check
