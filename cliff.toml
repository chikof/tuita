# git-cliff: CHANGELOG.md is generated from Conventional Commits and `v*` tags by scripts/release.sh.
# Never edit CHANGELOG.md by hand; fix the commit message or this config and regenerate.

[changelog]
header = """
# Changelog

Generated by [git-cliff](https://git-cliff.org) from Conventional Commits. Do not edit by hand.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# Scopes name a crate or module (`feat(parser): ...`), never a task id; the id goes in a `Task: NNNN` footer.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactors" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { message = "^revert", group = "<!-- 6 -->Reverts" },
  { message = "^(test|style|chore|build|ci)", skip = true },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
# Before 1.0, `feat` bumps the minor and breaking changes do not jump to 1.0.0.
features_always_bump_minor = true
breaking_always_bump_major = false
# First release when no tag exists yet (must match tag_pattern).
initial_tag = "v0.1.0"
