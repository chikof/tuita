[advisories]
yanked = "deny"

[licenses]
# The allow list covers common permissive licenses before the deps use them; don't warn on unused entries.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "AGPL-3.0",
  "AGPL-3.0-or-later",
  "CDLA-Permissive-2.0", # webpki-roots: Mozilla's CA list as data
]

# Workspace crates set `publish = false`, so they are not license-checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal `path` deps carry no version; fine while the crates are `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
